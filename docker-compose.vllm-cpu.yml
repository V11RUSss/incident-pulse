services:
  vllm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/${VLLM_MODEL_NAME}/${VLLM_MODEL_FILE}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --alias
      - ${AI_MODEL}
      - --ctx-size
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - --threads
      - "${LLAMA_THREADS:-8}"
      - --jinja
      - -np
      - "1"
