services:
  vllm:
    image: vllm/vllm-openai-xpu:latest
    privileged: true
    ipc: host
    shm_size: "8gb"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)\""
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s
